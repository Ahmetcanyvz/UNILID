[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilid"
version = "0.1.0"
description = "Fast multilingual language identification using unigram language models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Ahmet Can Yavuz"}
]
keywords = ["language-identification", "nlp", "tokenization", "multilingual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
train = [
    "torch>=1.9.0",
    "transformers>=4.20.0",
    "sentencepiece>=0.1.96",
    "ujson>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Ahmetcanyvz/UNILID"
Repository = "https://github.com/Ahmetcanyvz/UNILID"

[project.scripts]
unilid-convert = "unilid.model_io:_cli_convert"
unilid-eval = "unilid.cli:eval_main"

[tool.setuptools.packages.find]
include = ["unilid*"]

[tool.setuptools.package-data]
unilid = ["py.typed"]
