[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilid"
version = "0.2.1"
description = "Fast multilingual language identification using unigram language models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Ahmet Can Yavuz"}
]
keywords = ["language-identification", "nlp", "tokenization", "multilingual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
train = [
    "torch>=1.9.0",
    "transformers>=4.20.0",
    "sentencepiece>=0.1.96",
    "ujson>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Ahmetcanyvz/UNILID"
Repository = "https://github.com/Ahmetcanyvz/UNILID"

# Note: the former unilid-eval entry point targeted unilid.cli:eval_main, which
# never existed (eval.py is a repository script, not a package module); it is
# removed rather than left broken.
[project.scripts]
unilid-convert = "unilid.model_io:main"
unilid-add-language = "unilid.add_language:main"
unilid-calibrate = "unilid.calibrate_cli:main"

[tool.setuptools.packages.find]
include = ["unilid*"]

[tool.setuptools.package-data]
unilid = ["py.typed"]
